name: Tatil verisi güncelle

on:
  schedule:
    - cron: "0 2 10 18 *"      # her ayın 1'i, 02:00 UTC (05:00 TR)
  workflow_dispatch:
    inputs:
      force:
        description: "Tüm dosyaları yeniden üret (1 = evet)"
        required: false
        default: "0"
      only:
        description: "Sadece bu iller (virgülle, ör. Muğla,Ankara). Boş = hepsi"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: veri-guncelle
  cancel-in-progress: false

jobs:
  guncelle:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Veriyi üret
        env:
          FORCE: ${{ github.event.inputs.force }}
          ONLY: ${{ github.event.inputs.only }}
        run: python scripts/build_data.py

      - name: Değişiklikleri kaydet
        if: always()
        run: |
          git config user.name "tatil-veri-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "Değişiklik yok."
          else
            git commit -m "Veri güncellendi: $(date -u +%Y-%m-%d)"
            git push
          fi
